{% extends 'main/layout.html' %}
{% load static %}

{% block title %}Modrinth-like — Головна{% endblock %}

{% block content %}
    <form action="{% url 'search' %}" method="get" class="mb-3">
        <input class="search-bar" type="search" name="q" value="{{ query|default:'' }}" placeholder="Search mods...">
    </form>

    <div class="content-header">
        <div class="d-flex align-items-center gap-2">
            <span class="text-muted">Sort by:</span>
            <select class="sort-select">
                <option>Relevance</option>
                <option>Downloads</option>
                <option>Follows</option>
                <option>Recently updated</option>
            </select>
            <span class="text-muted ms-2">View:</span>
            <select class="sort-select">
                <option>20</option>
                <option>50</option>
            </select>
        </div>
        <div class="text-muted">
            <i class="fa-solid fa-list"></i>
        </div>
    </div>

    <div class="mod-list">
        {% for mod in mods %}
            {% include 'main/_mod_card.html' %}
        {% empty %}
            <div class="text-center text-muted p-5">
                <h3>Нічого не знайдено</h3>
            </div>
        {% endfor %}
    </div>
{% endblock %}

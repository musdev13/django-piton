{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Мій сайт{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="{% static 'main/css/bootstrap.min.css' %}" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">

    <!-- Меню -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'main' %}">Modrinht</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'main' %}active{% endif %}"
                           href="{% url 'main' %}">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}"
                           href="{% url 'about' %}">Про нас</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Послуги</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Контакти</a>
                    </li>
                </ul>

                <form class="d-flex ms-lg-3 mt-2 mt-lg-0" role="search" action="{% url 'search' %}" method="get">
                    <input class="form-control me-2" type="search" name="q" value="{{ query|default:'' }}" placeholder="Пошук модів...">
                    <button class="btn btn-outline-light" type="submit">Знайти</button>
                </form>

                <a href="{% url 'register' %}"
                   class="btn btn-warning fw-semibold ms-lg-3 mt-2 mt-lg-0{% if request.resolver_match.url_name == 'register' %} active{% endif %}">
                    Реєстрація
                </a>
            </div>
        </div>
    </nav>

    <!-- Основний контент -->
    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Підвал -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">© 2026 Мій сайт. Усі права захищені.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="{% static 'main/js/bootstrap.bundle.min.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>

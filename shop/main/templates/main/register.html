{% extends 'main/layout.html' %}
{% load static %}

{% block title %}Реєстрація — Мій сайт{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-3">Реєстрація</h1>

                    <form id="registerForm" data-url="{% url 'register_submit' %}" novalidate>
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="id_username" class="form-label">Ім'я користувача</label>
                            <input type="text" id="id_username" name="username" class="form-control" placeholder="username" required autocomplete="username">
                        </div>

                        <div class="mb-3">
                            <label for="id_email" class="form-label">Email</label>
                            <input type="email" id="id_email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
                        </div>

                        <div class="mb-3">
                            <label for="id_password" class="form-label">Пароль</label>
                            <input type="password" id="id_password" name="password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Зареєструватися</button>
                    </form>

                    <div id="registerMessage" class="mt-3" aria-live="polite"></div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'main/js/register.js' %}"></script>
{% endblock %}

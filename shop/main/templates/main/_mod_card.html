{% load static %}
<div class="col-md-4">
    <div class="card shadow-sm h-100">
        <img src="{% static mod.logo %}" class="card-img-top" alt="{{ mod.name }}" style="height: 200px; object-fit: contain; padding: 20px;">
        <div class="card-body">
            <h5 class="card-title">{{ mod.name }}</h5>
            <p class="card-text">{{ mod.description }}</p>
            <a href="{% url 'mod_detail' mod.id %}" class="btn btn-outline-primary">Details</a>
        </div>
    </div>
</div>

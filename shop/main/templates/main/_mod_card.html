{% load static %}
<a href="{% url 'mod_detail' mod.id %}" class="mod-card text-decoration-none">
    <img src="{% static mod.logo %}" class="mod-icon" alt="{{ mod.name }}">
    <div class="mod-content">
        <div class="mod-header">
            <div>
                <h5 class="mod-title">{{ mod.name }}</h5>
                <div class="mod-author">by Author</div>
            </div>
            <div class="mod-stats">
                <div><i class="fa-solid fa-download"></i> {{ mod.downloads }}</div>
                <div><i class="fa-regular fa-heart"></i> 0</div>
            </div>
        </div>
        <div class="mod-desc">{{ mod.description }}</div>
        <div class="mod-badges">
            <span class="mod-badge"><i class="fa-solid fa-gamepad"></i> Client</span>
            <span class="mod-badge"><i class="fa-solid fa-tag"></i> {{ mod.category }}</span>
            {% for tag in mod.tags.all|slice:":3" %}
                <span class="mod-badge">{{ tag.name }}</span>
            {% endfor %}
        </div>
    </div>
</a>
